# Woodpecker CI — Paper Extractor 流水线
# 在网页上手动触发执行
#
# 流程: build → deploy（备份 → 停旧 → 起新 → 健康检查 → 失败回滚）
# 改进: 新容器启动后轮询 /health，超时则自动回滚到旧镜像
#
# 健康检查用独立 curl 容器接入 extractor-net，通过容器名访问。

steps:
  - name: build
    image: docker:24
    commands:
      - docker build -t paper-extractor:latest .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  - name: deploy
    image: docker:24
    commands:
      - |
        set -e

        # ── 1. 写入配置 ──
        DEPLOY_DIR=/opt/paper-extractor
        cd "$DEPLOY_DIR"

        # 写入 config.yaml
        rm -rf config.yaml
        echo "$CONFIG_YAML" > config.yaml
        echo "config.yaml 已写入"

        # 写入 .env
        rm -rf .env
        echo "$ENV_FILE" > .env
        echo ".env 已写入"

        # ── 2. 备份数据库（部署前）──
        echo "备份数据库..."
        BACKUP_FILE=/tmp/paper_extractor_backup_$(date +%Y%m%d_%H%M%S).sql
        source .env
        docker run --rm -e PGPASSWORD=$DB_PASSWORD docker.io/library/postgres:latest \
          pg_dump -h $DB_HOST -U postgres -d paper_extractor > $BACKUP_FILE 2>/dev/null || echo "备份失败，继续部署"
        echo "备份完成: $BACKUP_FILE"

        # ── 3. 记录旧镜像（用于回滚）──
        OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' extractor-1 2>/dev/null) || OLD_IMAGE=""
        echo "旧镜像: ${OLD_IMAGE:-无}"

        # ── 4. 停旧容器 ──
        docker-compose down
        echo "旧容器已清理"

        # ── 5. 启动新容器 ──
        docker-compose up -d --build
        echo "新容器已启动"

        # ── 6. 健康检查（最多 60s）──
        echo "等待服务就绪..."
        for i in $(seq 1 20); do
          HEALTHY=true
          for port in 8001 8002 8003; do
            # 使用 host 网络模式访问宿主机端口
            if ! docker run --rm --network host curlimages/curl -fsS --max-time 2 http://localhost:$port/health > /dev/null 2>&1; then
              HEALTHY=false
              break
            fi
          done
          if [ "$HEALTHY" = true ]; then
            echo "✓ 部署成功，所有服务就绪"
            exit 0
          fi
          echo "等待中... ($i/20)"
          sleep 3
        done

        # ── 7. 健康检查失败 → 回滚 ──
        echo "✗ 新容器未就绪，执行回滚..."
        docker-compose down
        if [ -n "$OLD_IMAGE" ]; then
          docker-compose up -d
          echo "已回滚到旧镜像: $OLD_IMAGE"
        else
          echo "无旧镜像可回滚"
        fi
        exit 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/paper-extractor:/opt/paper-extractor
    environment:
      CONFIG_YAML:
        from_secret: CONFIG_YAML
      ENV_FILE:
        from_secret: ENV_FILE
