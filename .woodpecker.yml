# Woodpecker CI — Paper Extractor 流水线
# 在网页上手动触发执行
#
# 流程: build → deploy（构建镜像 → 启动服务 → 健康检查 → 失败回滚）
#
# Woodpecker 会克隆仓库到工作目录，docker-compose.yml 已在仓库中。
# 配置文件和环境变量通过 secrets 注入。

steps:
  - name: build
    image: docker:24
    commands:
      - docker build -t paper-extractor:latest .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  - name: deploy
    image: docker:24
    commands:
      - |
        set -e

        # ── 1. 写入配置（从 secrets 注入）──
        # Woodpecker 已克隆仓库，当前目录包含 docker-compose.yml
        echo "当前目录: $(pwd)"
        ls -la

        # 写入 config.yaml
        echo "$CONFIG_YAML" > config.yaml
        echo "config.yaml 已写入"

        # 写入 .env
        echo "$ENV_FILE" > .env
        echo ".env 已写入"

        # ── 2. 记录旧镜像（用于回滚）──
        OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' extractor-1 2>/dev/null) || OLD_IMAGE=""
        echo "旧镜像: ${OLD_IMAGE:-无}"

        # ── 4. 启动服务 ──
        docker-compose up -d --build
        echo "服务已启动"

        # ── 5. 健康检查（最多 60s）──
        echo "等待服务就绪..."
        for i in $(seq 1 20); do
          HEALTHY=true
          for port in 8001 8002 8003; do
            if ! docker run --rm --network extractor-net curlimages/curl -fsS --max-time 2 http://extractor-$port:8000/health > /dev/null 2>&1; then
              HEALTHY=false
              break
            fi
          done
          if [ "$HEALTHY" = true ]; then
            echo "✓ 部署成功，所有服务就绪"
            exit 0
          fi
          echo "等待中... ($i/20)"
          sleep 3
        done

        # ── 6. 健康检查失败 → 回滚 ──
        echo "✗ 新容器未就绪，执行回滚..."
        docker-compose down
        if [ -n "$OLD_IMAGE" ]; then
          docker-compose up -d
          echo "已回滚到旧镜像: $OLD_IMAGE"
        else
          echo "无旧镜像可回滚"
        fi
        exit 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONFIG_YAML:
        from_secret: CONFIG_YAML
      ENV_FILE:
        from_secret: ENV_FILE
