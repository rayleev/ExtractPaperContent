# ============================================================
# Woodpecker CI — Paper Extractor 流水线
# ============================================================
# 流程: build → deploy（构建镜像 → 启动服务 → 健康检查 → 失败回滚）
#
# 配置/数据统一存放在 /home/root01/deploy/paper-extractor/ 下：
#   config.yaml     → 由 CONFIG_YAML secret 写入
#   .env            → 由 ENV_FILE secret 写入
#   docs/PDF, docs/meta, output/parsed, output/logs, cache-1/2/3 → 运行时数据目录
#
# docker-compose.yml 使用绝对路径挂载，不依赖 woodpecker 临时工作区。
#
# 所需 Woodpecker secret（在仓库 Settings → Secrets 配置）:
#   CONFIG_YAML  → 完整的 config.yaml 内容
#   ENV_FILE     → 完整的 .env 内容
#
# 端口分配（宿主机:容器）:
#   extractor-1  8004:8000
#   extractor-2  8002:8000
#   extractor-3  8003:8000
# ============================================================

steps:
  - name: build
    image: docker:24
    commands:
      - docker build -t paper-extractor:latest .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  - name: deploy
    image: docker:24
    commands:
      - |
        set -e

        # ── 1. 写入配置到统一部署目录 ──
        DEPLOY_DIR=/home/root01/deploy/paper-extractor
        mkdir -p "$DEPLOY_DIR/docs/PDF" "$DEPLOY_DIR/docs/meta" \
                 "$DEPLOY_DIR/output/parsed" "$DEPLOY_DIR/output/logs" \
                 "$DEPLOY_DIR/output/runs-1" "$DEPLOY_DIR/output/runs-2" "$DEPLOY_DIR/output/runs-3" \
                 "$DEPLOY_DIR/cache-1" "$DEPLOY_DIR/cache-2" "$DEPLOY_DIR/cache-3"

        # 写入前先删除可能残留的同名目录（Docker bind mount 会把目录创建出来，echo 写入会失败）
        rm -rf "$DEPLOY_DIR/config.yaml" "$DEPLOY_DIR/.env" 2>/dev/null || true

        echo "$CONFIG_YAML" > "$DEPLOY_DIR/config.yaml"
        echo "$ENV_FILE" > "$DEPLOY_DIR/.env"

        # 验证文件写入成功且非空（secret 未配置时变量为空，文件只有换行）
        if [ ! -s "$DEPLOY_DIR/config.yaml" ]; then
          echo "✗ CONFIG_YAML secret 为空或未配置，无法写入 config.yaml"
          exit 1
        fi
        if [ ! -s "$DEPLOY_DIR/.env" ]; then
          echo "✗ ENV_FILE secret 为空或未配置，无法写入 .env"
          exit 1
        fi
        echo "config.yaml 和 .env 已写入 $DEPLOY_DIR 并验证"

        # ── 1.1 数据目录属主归位（容器内 uid 1000 必须能读写 bind mount 的目录）──
        # 容器以 USER 1000:1000 运行，宿主机 mkdir 出来的目录若是 root 属主，容器写不进去
        # 利用 docker 容器内的 root 权限 chown，不依赖宿主机 sudo
        # .env 不 chown，保持 root 属主 + 600 权限，让容器内 1000 进程能读但不能改（防 RCE 改凭据）
        chmod 600 "$DEPLOY_DIR/.env" 2>/dev/null || true
        docker run --rm -v "$DEPLOY_DIR":/data alpine sh -c \
          "chown -R 1000:1000 /data/docs /data/output /data/cache-1 /data/cache-2 /data/cache-3 && \
           chown 1000:1000 /data/config.yaml && \
           echo '✓ 数据目录属主已归位为 1000:1000'"
        echo "数据目录授权完成"

        # ── 2. 确保网络存在（docker-compose.yml 中两个网络都是 external）──
        docker network inspect infra >/dev/null 2>&1 || docker network create infra
        docker network inspect paper-extractor-net >/dev/null 2>&1 || docker network create paper-extractor-net
        echo "网络已就绪"

        # ── 3. 记录旧镜像（用于回滚）──
        # 用 if 语句而非 || 兜底，避免 set -e 模式下提前退出
        if OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' extractor-1 2>/dev/null); then
          echo "旧镜像: $OLD_IMAGE"
        else
          OLD_IMAGE=""
          echo "旧镜像: 无"
        fi

        # ── 4. 停止旧容器 ──
        # 不依赖 docker compose down（project name 不匹配时无法停止旧容器）
        # 直接用 docker rm -f 按容器名删除，确保不残留
        docker stop extractor-1 extractor-2 extractor-3 2>/dev/null || true
        docker rm -f extractor-1 extractor-2 extractor-3 2>/dev/null || true
        echo "旧容器已停止"

        # ── 5. 启动服务（失败时执行回滚，不被 set -e 提前退出）──
        # docker-compose.yml 使用绝对路径挂载，工作目录不影响挂载路径
        # --env-file 指定 .env 路径用于 yml 变量替换（${VAR}），与 services.env_file 不同
        if ! docker compose --env-file "$DEPLOY_DIR/.env" up -d --build; then
          echo "✗ docker compose up 失败，执行回滚..."
          if [ -n "$OLD_IMAGE" ]; then
            IMAGE_TAG="$OLD_IMAGE" docker compose --env-file "$DEPLOY_DIR/.env" up -d --no-build
            echo "已回滚到旧镜像: $OLD_IMAGE"
          else
            echo "无旧镜像可回滚"
          fi
          exit 1
        fi
        echo "服务已启动"

        # ── 6. 健康检查（最多 60s）──
        # 容器名是 extractor-1/2/3，通过 paper-extractor-net 网络用容器名:8000 访问
        echo "等待服务就绪..."
        for i in $(seq 1 20); do
          HEALTHY=true
          for idx in 1 2 3; do
            if ! docker run --rm --network paper-extractor-net curlimages/curl -fsS --max-time 2 http://extractor-$idx:8000/health > /dev/null 2>&1; then
              HEALTHY=false
              break
            fi
          done
          if [ "$HEALTHY" = true ]; then
            echo "✓ 部署成功，所有服务就绪"
            exit 0
          fi
          echo "等待中... ($i/20)"
          sleep 3
        done

        # ── 7. 健康检查失败 → 回滚 ──
        echo "✗ 新容器未就绪，执行回滚..."
        docker stop extractor-1 extractor-2 extractor-3 2>/dev/null || true
        docker rm -f extractor-1 extractor-2 extractor-3 2>/dev/null || true
        if [ -n "$OLD_IMAGE" ]; then
          IMAGE_TAG="$OLD_IMAGE" docker compose --env-file "$DEPLOY_DIR/.env" up -d --no-build
          echo "已回滚到旧镜像: $OLD_IMAGE"
        else
          echo "无旧镜像可回滚"
        fi
        exit 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/root01/deploy:/home/root01/deploy
    environment:
      CONFIG_YAML:
        from_secret: CONFIG_YAML
      ENV_FILE:
        from_secret: ENV_FILE
